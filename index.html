<!DOCTYPE html>
<html lang="uk">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Site</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

<header>

    <div class="logo">
        My Local Business
    </div>

    <nav>

        <a href="#">Головна</a>

        <a href="#">Запис онлайн</a>

    </nav>

    <button class="header-btn">
        ЗАБРОНЮВАТИ
    </button>

</header>

<section class="main">

    <h1>
        Наші Послуги
    </h1>

    <div class="content">

        <div class="cards">

            <div class="card">

                <img src="images/room1.jpg">

                <div class="card-info">

                    <h2>
                        Номер для одного
                    </h2>

                    <a href="#">
                        Детальніше
                    </a>

                    <div class="line"></div>

                    <p>24 год</p>

                    <p>250 грн</p>

                    <button class="select-room">
                        Обрати послугу
                    </button>

                </div>

            </div>

            <div class="card">

                <img src="images/room2.jpg">

                <div class="card-info">

                    <h2>
                        Номер для двох Люкс
                    </h2>

                    <a href="#">
                        Детальніше
                    </a>

                    <div class="line"></div>

                    <p>24 год</p>

                    <p>750 грн</p>

                    <button class="select-room">
                        Обрати послугу
                    </button>

                </div>

            </div>

        </div>

        <div class="booking-box">

            <h2>
                Швидкий запис
            </h2>

            <form id="bookingForm">

                <label>Ім'я</label>

                <input type="text" id="first_name">

                <label>Прізвище</label>

                <input type="text" id="last_name">

                <label>Email</label>

                <input type="email" id="email">

                <label>Телефон</label>

                <input type="text" id="phone">

                <label>Дата</label>

                <input type="date" id="booking_date">

                <button type="submit">
                    Надіслати
                </button>

            </form>

        </div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
